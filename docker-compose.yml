services:
  db:
    image: postgis/postgis:18-3.6
    container_name: oct_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-open_construction_twin_development}
      APP_QUEUE_DB: ${DB_QUEUE_NAME:-open_construction_twin_development_queue}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - oct-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-open_construction_twin_development}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  oct-postgres-data:
